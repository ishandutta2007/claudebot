<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bgGlow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for Elements -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#EDE9FE" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.3" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366F1" stroke-width="1" stroke-opacity="0.07" />
    </pattern>

    <!-- Filter for Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style type="text/css">
    <![CDATA[
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes floatUpDown {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatSlight {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes reverseRotateRing {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes waveBar1 {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1.3); }
    }
    @keyframes waveBar2 {
      0%, 100% { transform: scaleY(1.1); }
      50% { transform: scaleY(0.3); }
    }
    @keyframes waveBar3 {
      0%, 100% { transform: scaleY(0.6); }
      50% { transform: scaleY(1.4); }
    }
    @keyframes waveBar4 {
      0%, 100% { transform: scaleY(1.3); }
      50% { transform: scaleY(0.5); }
    }
    @keyframes waveBar5 {
      0%, 100% { transform: scaleY(0.5); }
      50% { transform: scaleY(1.2); }
    }

    .orb-anim { transform-origin: 960px 200px; animation: pulseOrb 5s ease-in-out infinite; }
    .float-anim { transform-origin: 960px 200px; animation: floatUpDown 4s ease-in-out infinite; }
    .badge-float { animation: floatSlight 4s ease-in-out infinite; }
    .ring-rot { transform-origin: 960px 200px; animation: rotateRing 20s linear infinite; }
    .ring-rot-rev { transform-origin: 960px 200px; animation: reverseRotateRing 15s linear infinite; }
    .star-1 { animation: blink 2.2s infinite ease-in-out; }
    .star-2 { animation: blink 3.1s infinite ease-in-out 0.7s; }
    .star-3 { animation: blink 2.7s infinite ease-in-out 1.4s; }
    .status-dot { transform-origin: 16px 16px; animation: pulseDot 2s ease-in-out infinite; }
    .wave-1 { transform-origin: -16px 18px; animation: waveBar1 1.1s ease-in-out infinite; }
    .wave-2 { transform-origin: -8px 18px; animation: waveBar2 1.3s ease-in-out infinite; }
    .wave-3 { transform-origin: 0px 18px; animation: waveBar3 0.9s ease-in-out infinite; }
    .wave-4 { transform-origin: 8px 18px; animation: waveBar4 1.2s ease-in-out infinite; }
    .wave-5 { transform-origin: 16px 18px; animation: waveBar5 1.0s ease-in-out infinite; }
    ]]>
  </style>

  <!-- Card Background -->
  <rect width="1200" height="400" rx="20" fill="#070A13" />
  
  <!-- Ambient Lighting -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGlow1)" />
  <rect width="1200" height="400" rx="20" fill="url(#bgGlow2)" />
  <rect width="1200" height="400" rx="20" fill="url(#centerGlow)" />
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="400" rx="20" fill="url(#grid)" />

  <!-- Outer Border Glow -->
  <rect x="1.5" y="1.5" width="1197" height="397" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Floating Star / Sparkle Accents -->
  <g fill="#A78BFA">
    <!-- Star 1 -->
    <path class="star-1" d="M 120 70 Q 120 85 135 85 Q 120 85 120 100 Q 120 85 105 85 Q 120 85 120 70 Z" fill="#C084FC" filter="url(#glow)"/>
    <!-- Star 2 -->
    <path class="star-2" d="M 620 50 Q 620 60 630 60 Q 620 60 620 70 Q 620 60 610 60 Q 620 60 620 50 Z" fill="#38BDF8" filter="url(#glow)"/>
    <!-- Star 3 -->
    <path class="star-3" d="M 480 340 Q 480 350 490 350 Q 480 350 480 360 Q 480 350 470 350 Q 480 350 480 340 Z" fill="#F472B6" filter="url(#glow)"/>
    <circle class="star-1" cx="240" cy="330" r="2.5" fill="#818CF8" />
    <circle class="star-2" cx="720" cy="350" r="3" fill="#C084FC" />
    <circle class="star-3" cx="110" cy="260" r="2" fill="#F43F5E" />
  </g>

  <!-- LEFT / MAIN CONTENT AREA -->
  <g transform="translate(80, 0)">
    
    <!-- Top Pill Badge -->
    <g transform="translate(0, 58)">
      <rect width="275" height="32" rx="16" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.6"/>
      <rect width="275" height="32" rx="16" fill="url(#pillGrad)"/>
      
      <!-- Pulsing Dot -->
      <circle class="status-dot" cx="16" cy="16" r="5" fill="#10B981" filter="url(#glow)" />
      <circle cx="16" cy="16" r="2.5" fill="#FFFFFF" />
      
      <text x="32" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#E0E7FF" letter-spacing="0.8">POWERED BY CLAUDE &amp; LOCAL AI</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 155)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">
        ClaudeBot
      </text>

      <!-- Bot Icon next to Title -->
      <g transform="translate(325, -46) scale(0.95)" class="badge-float">
        <rect width="52" height="52" rx="14" fill="#6366F1" fill-opacity="0.2" stroke="#818CF8" stroke-width="1.5"/>
        <path d="M16 26 C16 20, 36 20, 36 26 L36 34 C36 38, 16 38, 16 34 Z" fill="none" stroke="#C084FC" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="21" cy="27" r="2.5" fill="#38BDF8" filter="url(#glow)"/>
        <circle cx="31" cy="27" r="2.5" fill="#38BDF8" filter="url(#glow)"/>
        <path d="M26 14 L26 20" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
        <circle cx="26" cy="13" r="3" fill="#F43F5E" filter="url(#glow)"/>
      </g>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
      The Elegant, Privacy-First Desktop AI Assistant
    </text>

    <!-- Highlights & Feature Chips -->
    <g transform="translate(0, 245)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="34" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#A855F7"/>
        <text x="28" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">⚡ Fast &amp; Native</text>
      </g>
      
      <!-- Feature 2 -->
      <g transform="translate(148, 0)">
        <rect width="145" height="34" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#38BDF8"/>
        <text x="28" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">🔒 Local-First AI</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(303, 0)">
        <rect width="158" height="34" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#10B981"/>
        <text x="28" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">🌐 Multi-Platform</text>
      </g>

      <!-- Feature 4 -->
      <g transform="translate(471, 0)">
        <rect width="148" height="34" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#F59E0B"/>
        <text x="28" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">💻 Claude &amp; Ollama</text>
      </g>
    </g>

    <!-- Bottom Specs / Badges -->
    <g transform="translate(0, 315)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748B" letter-spacing="0.5">
        WINDOWS • MACOS • LINUX &#160;&#160;|&#160;&#160; OFFLINE CAPABLE &#160;&#160;|&#160;&#160; ZERO DISTRACTIONS
      </text>
    </g>
  </g>

  <!-- RIGHT SIDE: INTERACTIVE AI ORBIT & FLOATING GRAPHIC -->
  <g transform="translate(0, 0)">
    
    <!-- Outer Dash Rotating Ring -->
    <circle class="ring-rot" cx="960" cy="200" r="130" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="8 14" stroke-opacity="0.4" />
    
    <!-- Inner Dash Reverse Rotating Ring -->
    <circle class="ring-rot-rev" cx="960" cy="200" r="95" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="6 10" stroke-opacity="0.5" />

    <!-- Pulsing Center Orb / Glow Sphere -->
    <circle class="orb-anim" cx="960" cy="200" r="70" fill="url(#bgGlow1)" />

    <!-- Central Interactive Core Illustration -->
    <g class="float-anim">
      
      <!-- Core Background Plate -->
      <rect x="895" y="135" width="130" height="130" rx="30" fill="#131127" stroke="url(#borderGrad)" stroke-width="2" />

      <!-- Anthropic / Claude Warm Glow Shape -->
      <path d="M 932 225 L 932 195 Q 932 172 960 172 Q 988 172 988 195 L 988 225 Z" fill="none" stroke="url(#textGrad)" stroke-width="3" stroke-linecap="round"/>
      
      <!-- AI Sparks & Eyes -->
      <circle cx="948" cy="198" r="5" fill="#38BDF8" filter="url(#glow)" />
      <circle cx="972" cy="198" r="5" fill="#38BDF8" filter="url(#glow)" />
      
      <!-- Dynamic Animated Soundwave / Processing Indicator -->
      <g stroke="#C084FC" stroke-width="2.5" stroke-linecap="round">
        <line class="wave-1" x1="944" y1="214" x2="944" y2="222" />
        <line class="wave-2" x1="952" y1="211" x2="952" y2="225" />
        <line class="wave-3" x1="960" y1="208" x2="960" y2="228" />
        <line class="wave-4" x1="968" y1="212" x2="968" y2="224" />
        <line class="wave-5" x1="976" y1="215" x2="976" y2="221" />
      </g>
    </g>

    <!-- Floating Satellite 1: Claude Spark -->
    <g class="badge-float" transform="translate(855, 90)">
      <rect width="84" height="28" rx="14" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1" fill-opacity="0.9"/>
      <circle cx="14" cy="14" r="4" fill="#D97706" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FDE68A">Claude 3.5</text>
    </g>

    <!-- Floating Satellite 2: Ollama / Local -->
    <g class="badge-float" transform="translate(1015, 290)">
      <rect width="82" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1" fill-opacity="0.9"/>
      <circle cx="14" cy="14" r="4" fill="#38BDF8" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#BAE6FD">Ollama</text>
    </g>

    <!-- Floating Satellite 3: Privacy Shield -->
    <g class="badge-float" transform="translate(1040, 95)">
      <circle cx="16" cy="16" r="16" fill="#1E1B4B" stroke="#EC4899" stroke-width="1" fill-opacity="0.9"/>
      <path d="M16 9 L22 12 V17 C22 20.5 19.5 23 16 24 C12.5 23 10 20.5 10 17 V12 Z" fill="none" stroke="#F472B6" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
